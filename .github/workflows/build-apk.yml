name: Build Android APK

# Round 25 - the waiter app.
#
# You never install Gradle or Android Studio.  Push the code and this file
# builds the APK for you on GitHub's own computer, then hands it back as a
# download on the run's page (Actions -> this run -> "waiter-app-apk").
#
# The build needs NOTHING from this restaurant: the app talks to the main
# server over the wi-fi at run time, so the workflow only has to compile
# Kotlin.  No data folder, no database, no printer is touched.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  # lets you build by hand: Actions -> Build Android APK -> Run workflow
  workflow_dispatch:

jobs:
  build:
    name: Build the waiter app
    runs-on: ubuntu-latest

    # the workflow only reads the repository - it never writes to it
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Android's build tools need JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # installs the Android SDK command line tools and accepts the licences,
      # so assembleDebug can download the platform it compiles against
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # installs Gradle itself - the reason you do not need it at home
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build the APK
        run: gradle -p mobile assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          set -e
          apk="$(ls mobile/app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "Built: $apk"
          cp "$apk" "mobile/app/build/outputs/apk/debug/MUGHAL-E-AZAM-waiter-app.apk"

      # this is the download you want: open the run, scroll to "Artifacts"
      - name: Hand back the APK
        uses: actions/upload-artifact@v4
        with:
          name: waiter-app-apk
          path: mobile/app/build/outputs/apk/debug/MUGHAL-E-AZAM-waiter-app.apk
          if-no-files-found: error
          retention-days: 30
